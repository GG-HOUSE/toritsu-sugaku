splay:block;margin:6px auto;\">\n<polyline points=\"30,150 80,30 230,30 180,150 30,150\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.4\"/>\n<line x1=\"30\" y1=\"150\" x2=\"230\" y2=\"30\" stroke=\"#333\" stroke-width=\"1\"/>\n<line x1=\"80\" y1=\"30\" x2=\"180\" y2=\"150\" stroke=\"#333\" stroke-width=\"1\"/>\n<line x1=\"63.3\" y1=\"70.0\" x2=\"196.7\" y2=\"110.0\" stroke=\"#333\" stroke-width=\"1.3\"/>\n<circle cx=\"30.0\" cy=\"150.0\" r=\"2.3\" fill=\"#333\"/><text x=\"16.0\" y=\"154.0\" font-size=\"13\">A</text>\n<circle cx=\"80.0\" cy=\"30.0\" r=\"2.3\" fill=\"#333\"/><text x=\"74.0\" y=\"22.0\" font-size=\"13\">B</text>\n<circle cx=\"230.0\" cy=\"30.0\" r=\"2.3\" fill=\"#333\"/><text x=\"236.0\" y=\"22.0\" font-size=\"13\">C</text>\n<circle cx=\"180.0\" cy=\"150.0\" r=\"2.3\" fill=\"#333\"/><text x=\"188.0\" y=\"154.0\" font-size=\"13\">D</text>\n<circle cx=\"130.0\" cy=\"90.0\" r=\"2.3\" fill=\"#333\"/><text x=\"136.0\" y=\"100.0\" font-size=\"13\">O</text>\n<circle cx=\"63.3\" cy=\"70.0\" r=\"2.3\" fill=\"#333\"/><text x=\"49.3\" y=\"68.0\" font-size=\"13\">P</text>\n<circle cx=\"196.7\" cy=\"110.0\" r=\"2.3\" fill=\"#333\"/><text x=\"204.7\" y=\"114.0\" font-size=\"13\">Q</text>\n</svg>", "items": [{"kind": "choice", "field": "図形", "topic": "平行線と角度", "no": 1, "q": "∠OAP=a°，∠OPA=b°とするとき、∠OQCの大きさを表す式を、次のうちから選べ。", "choices": ["a度", "b度", "(180-a-b)度", "(a+b)度"], "answer": 1, "explain": "△AOPで∠AOP=180-a-b。対頂角より∠COQ=180-a-b。錯角（AB∥DC）より∠OCQ=∠OAP=a。△COQの内角の和より∠OQC=180-a-(180-a-b)=b"}, {"kind": "write", "field": "証明", "topic": "合同の証明", "no": "2-1", "q": "△AOP と △COQ が合同（△AOP≡△COQ）であることを証明せよ。", "sample": "平行四辺形の対角線はそれぞれの中点で交わるからAO=CO…①。AB∥DCより錯角が等しいから∠OAP=∠OCQ…②。対頂角は等しいから∠AOP=∠COQ…③。①②③より1組の辺とその両端の角がそれぞれ等しいから△AOP≡△COQ。"}, {"kind": "write", "field": "図形", "topic": "合同の性質の利用", "no": "2-2", "q": "AB=14cm，AP=9cmのとき、線分PBの長さと線分CQの長さをそれぞれ求めよ。", "sample": "PB=5cm、CQ=9cm"}]}, {"id": "q5", "title": "大問5　図1・図2について、次の各問に答えよ。円周率はπとする。", "lead": null, "items": [{"kind": "write", "field": "空間図形", "topic": "空間図形・体積", "no": 1, "q": "底面の半径が3cm，高さが8cmの円柱の体積を求めよ。", "sample": "72π cm³", "lead": "<svg viewBox=\"0 0 200 200\" style=\"width:150px;max-width:100%;display:block;margin:6px auto;\">\n<ellipse cx=\"100\" cy=\"40\" rx=\"60\" ry=\"18\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.3\"/>\n<line x1=\"40\" y1=\"40\" x2=\"40\" y2=\"140\" stroke=\"#333\" stroke-width=\"1.3\"/>\n<line x1=\"160\" y1=\"40\" x2=\"160\" y2=\"140\" stroke=\"#333\" stroke-width=\"1.3\"/>\n<path d=\"M40,140 A60,18 0 0 0 160,140\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.3\"/>\n<path d=\"M40,40 A60,18 0 0 0 160,40\" fill=\"none\" stroke=\"#333\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n<text x=\"55\" y=\"95\" font-size=\"12\">8cm</text>\n<text x=\"90\" y=\"34\" font-size=\"12\">3cm</text>\n</svg>"}, {"kind": "write", "field": "空間図形", "topic": "空間図形・表面積", "no": 2, "q": "底面の半径が4cm，母線の長さが9cmの円錐の側面積を求めよ。", "sample": "36π cm²", "lead": "<svg viewBox=\"0 0 200 170\" style=\"width:150px;max-width:100%;display:block;margin:6px auto;\">\n<ellipse cx=\"100\" cy=\"140\" rx=\"55\" ry=\"16\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.3\"/>\n<line x1=\"45\" y1=\"140\" x2=\"100\" y2=\"30\" stroke=\"#333\" stroke-width=\"1.3\"/>\n<line x1=\"155\" y1=\"140\" x2=\"100\" y2=\"30\" stroke=\"#333\" stroke-width=\"1.3\"/>\n<path d=\"M45,140 A55,16 0 0 0 155,140\" fill=\"none\" stroke=\"#333\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n<text x=\"112\" y=\"90\" font-size=\"12\">9cm</text>\n<text x=\"88\" y=\"160\" font-size=\"12\">4cm</text>\n</svg>"}]}];
const MARUS = ["ア","イ","ウ","エ"];
const root = document.getElementById('quizRoot');

function renderChoiceItem(sec, item) {
  let html = `<div class="item" data-kind="choice" data-field="${item.field||''}" data-topic="${item.topic||''}" data-answer="${item.answer}" id="item-${sec.id}-${item.no}">`;
  if (item.title) html += `<div class="item-title">${item.title}</div>`;
  if (item.lead) html += `<div class="item-lead">${item.lead}</div>`;
  html += `<div class="qtext"><span class="qtag">${item.field||''}</span>〔問${item.no}〕 ${item.q}</div>`;
  item.choices.forEach((c, i) => {
    html += `<label class="choice-label">
      <input type="radio" name="ans-${sec.id}-${item.no}" value="${i}">
      <span><span class="choice-mark">${MARUS[i]}</span>${c}</span>
    </label>`;
  });
  html += `<div class="result-box" id="result-${sec.id}-${item.no}"></div>`;
  html += `</div>`;
  return html;
}

function renderWriteItem(sec, item) {
  const uid = `${sec.id}-${item.no}`;
  let html = `<div class="item" data-kind="write" data-field="${item.field||''}" data-topic="${item.topic||''}" id="item-${uid}">`;
  if (item.title) html += `<div class="item-title">${item.title}</div>`;
  if (item.lead) html += `<div class="item-lead">${item.lead}</div>`;
  html += `<div class="qtext"><span class="qtag">${item.field||''}</span>〔問${item.no}〕 ${item.q}</div>`;
  html += `<textarea id="write-${uid}" placeholder="ここに答えを書いてみよう"></textarea>`;
  html += `<div><button class="reveal-btn" onclick="toggleSample('${uid}')">解答例を見る</button>
    <button class="self-btn" id="ok-${uid}" onclick="setSelf('${uid}','ok')">できた</button>
    <button class="self-btn" id="ng-${uid}" onclick="setSelf('${uid}','ng')">もう一息</button></div>`;
  html += `<div class="sample-box" id="sample-${uid}">【解答例】${item.sample}</div>`;
  html += `</div>`;
  return html;
}

function toggleSample(uid) {
  const box = document.getElementById(`sample-${uid}`);
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

const selfRatings = {};
function setSelf(uid, rating) {
  selfRatings[uid] = rating;
  const ok = document.getElementById(`ok-${uid}`);
  const ng = document.getElementById(`ng-${uid}`);
  ok.classList.toggle('active-ok', rating === 'ok');
  ng.classList.toggle('active-ng', rating === 'ng');
}

SECTIONS.forEach(sec => {
  let html = `<div class="section-card"><div class="section-title">${sec.title}</div>`;
  if (sec.lead) html += `<div class="section-lead">${sec.lead}</div>`;
  sec.items.forEach(item => {
    html += item.kind === 'choice' ? renderChoiceItem(sec, item) : renderWriteItem(sec, item);
  });
  html += `</div>`;
  root.insertAdjacentHTML('beforeend', html);
});

let lastResult = null;

function gradeAll() {
  let correct = 0, total = 0;
  const byField = {};
  const weakTopics = [];
  const detail = [];

  SECTIONS.forEach(sec => {
    sec.items.forEach(item => {
      const uid = `${sec.id}-${item.no}`;
      const field = item.field || '未分類';
      if (!byField[field]) byField[field] = {correct:0, total:0};

      if (item.kind === 'choice') {
        total++;
        byField[field].total++;
        const sel = document.querySelector(`input[name="ans-${uid}"]:checked`);
        const box = document.getElementById(`result-${uid}`);
        box.style.display = 'block';
        const isCorrect = sel && parseInt(sel.value) === item.answer;
        if (isCorrect) {
          correct++;
          byField[field].correct++;
          box.className = 'result-box result-correct';
          box.textContent = `正解！ 【解説】${item.explain}`;
        } else {
          box.className = 'result-box result-wrong';
          const chosen = sel ? MARUS[parseInt(sel.value)] : '未回答';
          box.textContent = `不正解（あなたの回答：${chosen} / 正解：${MARUS[item.answer]}） 【解説】${item.explain}`;
          weakTopics.push(item.topic || field);
        }
        detail.push({section: sec.id, no: item.no, kind: 'choice', field, topic: item.topic,
                      chosen: sel ? MARUS[parseInt(sel.value)] : null, correctAnswer: MARUS[item.answer], isCorrect: !!isCorrect});
      } else {
        const uid2 = uid;
        const rating = selfRatings[uid2] || null;
        if (rating === 'ng') weakTopics.push(item.topic || field);
        detail.push({section: sec.id, no: item.no, kind: 'write', field, topic: item.topic,
                      answerText: (document.getElementById(`write-${uid2}`)||{}).value || '', selfRating: rating});
      }
    });
  });

  document.getElementById('scoreNum').textContent = correct;
  document.getElementById('scoreTotal').textContent = total;

  const tbody = document.querySelector('#fieldTable tbody');
  tbody.innerHTML = '';
  Object.keys(byField).forEach(f => {
    const d = byField[f];
    const rate = d.total ? Math.round(d.correct/d.total*100) : 0;
    tbody.insertAdjacentHTML('beforeend', `<tr><td>${f}</td><td>${d.correct}</td><td>${d.total}</td><td>${rate}%</td></tr>`);
  });

  const weakList = document.getElementById('weakList');
  if (weakTopics.length) {
    const uniq = [...new Set(weakTopics)];
    weakList.innerHTML = '苦手そうな単元：' + uniq.map(t => `<span class="weak-tag">${t}</span>`).join('');
  } else {
    weakList.innerHTML = '';
  }

  document.getElementById('scoreSummary').style.display = 'block';
  document.getElementById('scoreSummary').scrollIntoView({behavior:'smooth'});
  document.getElementById('saveBtn').style.display = 'inline-block';

  lastResult = {
    examTitle: "数学Vもぎ対策オリジナル問題（8月号出題範囲ベース）",
    studentName: document.getElementById('studentName').value || null,
    date: new Date().toISOString(),
    elapsedSeconds: elapsed,
    choiceScore: {correct, total},
    byField,
    weakTopics: [...new Set(weakTopics)],
    detail
  };
}

async function saveResults() {
  if (!lastResult) return;
  const filename = `Vもぎ数学結果_${lastResult.date.slice(0,10)}_${String(new Date().getHours()).padStart(2,'0')}${String(new Date().getMinutes()).padStart(2,'0')}.json`;
  const text = JSON.stringify(lastResult, null, 2);

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{description: 'JSON', accept: {'application/json': ['.json']}}]
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      alert('保存しました。次回はこのファイルをClaudeに見せてください。');
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
      // フォールバックへ
    }
  }
  const blob = new Blob([text], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

let timerInterval = null;
let elapsed = 0;
function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    elapsed++;
    const m = String(Math.floor(elapsed/60)).padStart(2,'0');
    const s = String(elapsed%60).padStart(2,'0');
    document.getElementById('timerDisplay').textContent = `${m}:${s}`;
  }, 1000);
}
function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  elapsed = 0;
  document.getElementById('timerDisplay').textContent = '00:00';
}
</script>
